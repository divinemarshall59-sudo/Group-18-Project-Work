<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - COVE ESTATE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
        <img src="images/logo.png" alt="COVE ESTATE Logo" class="logo-img">
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
    <div class="auth">
      <a href="#" class="login">Login</a>
      <a href="#" class="signup">Sign Up</a>
    </div>
  </header>

  <main class="container">
    <section class="left-column">
      <div class="card">
        <div class="card-text">
          <h3>Get in Touch</h3>
          <p><strong>Address:</strong> 15 Admiralty Way, Bori Phase 1, Abuja</p>
          <p><strong>Phone:</strong> +234 801 234 5678</p>
          <p><strong>Email:</strong> info@abbyrealty.ng</p>
          <p><strong>Hours:</strong> Mon - Sat, 9am - 6pm</p>
        </div>
      </div>
    </section>

    <section class="right-column">
      <h2>Send Us a Message</h2>
      <form>
        <input type="text" placeholder="Your Name" required>
        <input type="email" placeholder="Your Email" required>
        <input type="text" placeholder="Subject" required>
        <textarea placeholder="Your Message" rows="5" required></textarea>
        <button type="submit">Send Message</button>
      </form>
    </section>
  </main>

  <footer>
    <p>© 2026 COVE ESTATE. All rights reserved.</p>
  </footer>
</body>
</html>
